name: Lifecycle tests

on:
  push:
  pull_request:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run audit lifecycle unit tests
        run: python -m unittest audit_lifecycle.tests.test_lifecycle -v
