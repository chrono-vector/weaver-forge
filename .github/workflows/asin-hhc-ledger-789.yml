name: External Verification - ASIN-HHC Ledger 789

on:
  push:
    branches: [development/independent-verification-v2]
    paths:
      - .github/workflows/asin-hhc-ledger-789.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-replay-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout external frozen source (not main)
        uses: actions/checkout@v5
        with:
          repository: dbottrader/ASIN-HHC-Agent-Mesh
          ref: a9b0787078dc9db9d33eac272a2c005c165acef4
          persist-credentials: false
          path: asin-source
      - name: Verify pinned source, input bytes, and ledger replay
        shell: bash
        run: |
          set -euo pipefail
          cd asin-source
          test "$(git rev-parse HEAD)" = "a9b0787078dc9db9d33eac272a2c005c165acef4"
          sha256sum artifacts/ledger-789-replay/ledger-789.json
          echo '65cd7a56213b5bf6d729168b6ce71fea1d294122f570248db2843b84e8612276  artifacts/ledger-789-replay/ledger-789.json' | sha256sum --check --status
          python3 artifacts/ledger-789-replay/replay.py | tee ../asin-replay-output.txt
          grep -q '^rows=789$' ../asin-replay-output.txt
          grep -q '^tip=7ff43e4de6bb8cd1fa68c9514af4876741a1aa203377cc4fbec40c179aabefcb$' ../asin-replay-output.txt
          grep -q '^result=PASS$' ../asin-replay-output.txt
      - name: Independent negative mutation check (in memory, no source edits)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, importlib.util
          from pathlib import Path
          script = Path('asin-source/artifacts/ledger-789-replay/replay.py')
          spec = importlib.util.spec_from_file_location('asin_ledger_replay', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          entries = module.load_entries(script.parent / 'ledger-789.json')
          changed = copy.deepcopy(entries)
          changed[100]['payload'] = changed[100]['payload'] + 'tampered'
          ok, errors, tip = module.replay(changed)
          assert not ok and any('hash mismatch at seq 101' in e for e in errors), errors
          assert entries[100]['payload'] != changed[100]['payload']
          print('NEGATIVE_CONTROL=PASS (tamper detected at seq 101)')
          PY
      - name: Retain bounded replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asin-hhc-ledger-789-replay-output
          path: asin-replay-output.txt
          if-no-files-found: warn
          retention-days: 30

  archive-run-evidence:
    name: Capture previous job log, replay artifact, and SHA-256 manifest
    needs: independently-replay-ledger
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect finished job evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_OUTCOME: ${{ needs.independently-replay-ledger.result }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'run=%s\nsha=%s\nsource_repo=%s\nsource_commit=%s\nreplay_job_outcome=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "dbottrader/ASIN-HHC-Agent-Mesh" "a9b0787078dc9db9d33eac272a2c005c165acef4" "$REPLAY_OUTCOME" > evidence/RUN_METADATA.txt
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name=="independently-replay-ledger") | .id' | head -n 1)
          test -n "$job_id"
          curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" -o evidence/independently-replay-ledger.log
          test -s evidence/independently-replay-ledger.log
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="asin-hhc-ledger-789-replay-output" and .expired==false) | .id' | head -n 1)
          if [ -n "$artifact_id" ]; then
            curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o evidence/asin-hhc-ledger-789-replay-output.zip
            unzip -t evidence/asin-hhc-ledger-789-replay-output.zip
          else
            printf 'MISSING_ARTIFACT: asin-hhc-ledger-789-replay-output\n' > evidence/ARTIFACT_MISSING.txt
          fi
          ( cd evidence && sha256sum independently-replay-ledger.log RUN_METADATA.txt > SHA256SUMS.txt )
          if [ -f evidence/asin-hhc-ledger-789-replay-output.zip ]; then ( cd evidence && sha256sum asin-hhc-ledger-789-replay-output.zip >> SHA256SUMS.txt ); fi
          if [ -f evidence/ARTIFACT_MISSING.txt ]; then ( cd evidence && sha256sum ARTIFACT_MISSING.txt >> SHA256SUMS.txt ); fi
          ( cd evidence && sha256sum --check SHA256SUMS.txt )
          cat evidence/RUN_METADATA.txt
          cat evidence/SHA256SUMS.txt
      - name: Upload temporary original evidence bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asin-hhc-ledger-789-run-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
